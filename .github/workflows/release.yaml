# Releases norconex-commons-lang to Maven Central.
#
# WHY THIS IS ONE WORKFLOW (unlike Norconex/crawler)
# ==================================================
# The crawler repo splits this in two: a "Release" workflow bumps the version
# and pushes, and the main CI/CD workflow reacts to that push and does the
# actual publishing. That split exists there because the crawler's release
# gate is a ~2h integration-test suite worth running as its own CI run, and it
# requires a RELEASE_PAT secret — GitHub does not re-trigger workflows for
# commits pushed with GITHUB_TOKEN, so the handoff needs a PAT.
#
# commons-lang is a single-module library with a fast test suite and no
# RELEASE_PAT secret, so everything runs here in one job. That also removes a
# failure mode seen in the crawler repo: while the branch sits at a
# non-SNAPSHOT version, ANY other push to it re-triggers the whole release
# path. Here the version is non-SNAPSHOT only for the few minutes this job is
# running, and ci.yml does not watch release/* branches at all.
#
# HOW TO USE
# ==========
# 1. Create a release/* branch from main (e.g. release/3.0.x).
#    The branch stays at X.Y.Z-SNAPSHOT between releases.
# 2. Add changelogs/changelog-X.Y.Z.md on that branch, with real content.
#    Use changelogs/TEMPLATE.md as a guide. The version in the filename must
#    match the version being released — this prevents silently reusing an old
#    changelog.
# 3. Actions -> "Release" -> "Run workflow", pick the release/* branch, enter
#    the target version (e.g. 3.0.0).
# 4. This job then: validates -> sets the version -> runs the full test suite
#    -> publishes to Maven Central -> tags -> creates a GitHub Release from
#    the changelog -> returns the branch to a SNAPSHOT version.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 3.0.0) — must not contain SNAPSHOT"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      # Needed to push the version-bump commits, push the tag, and create the
      # GitHub Release.
      contents: write

    steps:
      #--- Step ------------------------------------------------------------------

      - name: Validate branch is release/*
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/heads/release/ ]]; then
            echo "ERROR: This workflow must be run on a release/* branch."
            echo "Current ref: $GITHUB_REF"
            echo "Select a release/* branch from the 'Run workflow' dropdown."
            exit 1
          fi

      #--- Step ------------------------------------------------------------------

      - name: Validate version input has no SNAPSHOT
        run: |
          if [[ "${{ inputs.version }}" == *SNAPSHOT* ]]; then
            echo "ERROR: Version '${{ inputs.version }}' must not contain SNAPSHOT."
            exit 1
          fi

      #--- Step ------------------------------------------------------------------

      - name: Validate version major matches branch major
        run: |
          # Branch name after release/ may be e.g. "3.x" or "3.0.x" — take the
          # leading integer as the branch major.
          BRANCH_SEGMENT="${GITHUB_REF#refs/heads/release/}"
          BRANCH_MAJOR=$(echo "$BRANCH_SEGMENT" | cut -d. -f1)
          INPUT_MAJOR=$(echo "${{ inputs.version }}" | cut -d. -f1)
          if [[ "$INPUT_MAJOR" != "$BRANCH_MAJOR" ]]; then
            echo "ERROR: Version '${{ inputs.version }}' (major: ${INPUT_MAJOR}) does not match branch '${BRANCH_SEGMENT}' (major: ${BRANCH_MAJOR})."
            exit 1
          fi

      #--- Step ------------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #--- Step ------------------------------------------------------------------

      - name: Set up JDK 21 and Maven
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      #--- Step ------------------------------------------------------------------

      - name: Validate current POM is SNAPSHOT
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "ERROR: Current POM version '$CURRENT' is not a SNAPSHOT."
            echo "This branch may have already been released, or a previous run failed partway."
            exit 1
          fi
          echo "Current version: $CURRENT -> releasing as: ${{ inputs.version }}"

      #--- Step ------------------------------------------------------------------

      # A published Maven Central version can never be replaced or deleted, so
      # refuse early if this version was already tagged rather than failing
      # later against Central.
      - name: Validate version was not already released
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ inputs.version }}" > /dev/null 2>&1; then
            echo "ERROR: Tag v${{ inputs.version }} already exists — that version was already released."
            echo "Maven Central releases are permanent; pick a new version."
            exit 1
          fi

      #--- Step ------------------------------------------------------------------

      - name: Validate changelog file exists and has content
        run: |
          CHANGELOG_FILE="changelogs/changelog-${{ inputs.version }}.md"
          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            echo "ERROR: Changelog file not found: $CHANGELOG_FILE"
            echo "Create it on this branch before releasing (see changelogs/TEMPLATE.md)."
            exit 1
          fi
          if ! grep -q '[a-zA-Z0-9]' "$CHANGELOG_FILE"; then
            echo "ERROR: Changelog file is empty or contains only whitespace: $CHANGELOG_FILE"
            exit 1
          fi
          echo "Changelog found and validated: $CHANGELOG_FILE"

      #--- Step ------------------------------------------------------------------

      - name: Set release version in POM
        run: |
          mvn versions:set \
            -DnewVersion=${{ inputs.version }} \
            -DgenerateBackupPoms=false \
            -B

      #--- Step ------------------------------------------------------------------

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "chore(release): set version to ${{ inputs.version }}"
          git push

      #--- Step ------------------------------------------------------------------

      # Full test suite gates the release. Runs BEFORE deploy: a Maven Central
      # release cannot be taken back, so a failure must stop the release before
      # anything is published.
      - name: Run tests (release gate)
        run: mvn -B clean verify -Dgpg.skip=true -Dsonar.skip=true

      #--- Step ------------------------------------------------------------------

      # Tests are not re-run here — the gate above already ran them on this
      # exact commit. -DskipTests (not -Dmaven.test.skip) so test classes are
      # still compiled and any test-jar artifact is still produced.
      - name: Publish to Maven Central
        run: mvn -B deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      #--- Step ------------------------------------------------------------------

      - name: Tag release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      #--- Step ------------------------------------------------------------------

      - name: Create GitHub Release
        run: |
          VERSION="${{ inputs.version }}"

          # Versions carrying a qualifier (3.0.0-beta.1, 3.0.0-rc1, …) are
          # published as GitHub pre-releases so the repository's "Latest
          # release" badge stays on the newest stable version.
          PRERELEASE_FLAG=""
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE_FLAG="--prerelease"
            echo "Version '$VERSION' has a qualifier — publishing as a pre-release."
          fi

          # Notes come from our curated changelog, not gh's --generate-notes:
          # the changelog is validated above, so it is always present here.
          gh release create "v${VERSION}" \
            --title "Release ${VERSION}" \
            --notes-file "changelogs/changelog-${VERSION}.md" \
            $PRERELEASE_FLAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #--- Step ------------------------------------------------------------------

      # Return the branch to a SNAPSHOT so it is never left sitting on a
      # release version.
      - name: Bump to next development version
        if: success()
        run: |
          VERSION="${{ inputs.version }}"

          # Strip any qualifier before doing arithmetic: reading "3.0.0-beta.1"
          # straight into MAJOR/MINOR/PATCH puts "0-beta" in PATCH, which bash
          # evaluates as 0 and would bump to 3.0.1-SNAPSHOT — silently skipping
          # 3.0.0 and making it unreleasable from this branch.
          BASE="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          if [[ "$VERSION" == "$BASE" ]]; then
            # Final release: open the next patch for development.
            NEXT_SNAPSHOT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          else
            # Pre-release: return to the SNAPSHOT of the SAME target version so
            # the final X.Y.Z can still be cut from this branch afterwards.
            NEXT_SNAPSHOT="${MAJOR}.${MINOR}.${PATCH}-SNAPSHOT"
          fi
          echo "Released '$VERSION' — next development version: $NEXT_SNAPSHOT"

          mvn versions:set \
            -DnewVersion="$NEXT_SNAPSHOT" \
            -DgenerateBackupPoms=false \
            -B
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "chore(release): bump to next development version ${NEXT_SNAPSHOT}"
          git push

      #--- Step ------------------------------------------------------------------

      # After a FINAL release, the default branch may still be sitting on the
      # SNAPSHOT of the version just released (e.g. main on 3.0.0-SNAPSHOT
      # after 3.0.0 ships). That coordinate now belongs to a published version,
      # yet every push to main would keep republishing snapshots under it, so
      # move main on to the next feature line.
      #
      # Deliberately skipped for pre-releases: after 3.0.0-beta.1 the base
      # version 3.0.0 has NOT shipped, and main must stay on 3.0.0-SNAPSHOT so
      # the GA release can still be cut.
      #
      # This runs after the artifacts are already on Maven Central, so it must
      # never fail the job — a protected default branch that refuses the push
      # is reported as a warning to follow up manually.
      - name: Move default branch off the released version
        if: success()
        run: |
          VERSION="${{ inputs.version }}"
          BASE="${VERSION%%-*}"

          if [[ "$VERSION" != "$BASE" ]]; then
            echo "'$VERSION' is a pre-release — leaving the default branch as is."
            exit 0
          fi

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          NEXT_MINOR="${MAJOR}.$((MINOR + 1)).0-SNAPSHOT"

          git fetch origin "$DEFAULT_BRANCH" --quiet
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH" --quiet

          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          # Only move it when it is still on the version just released. If it
          # has already advanced (a maintenance release cut from an older
          # release branch, say), leave it alone rather than rewinding it.
          if [[ "$CURRENT" != "${BASE}-SNAPSHOT" ]]; then
            echo "$DEFAULT_BRANCH is on '$CURRENT', not '${BASE}-SNAPSHOT' — leaving it as is."
            exit 0
          fi

          echo "Moving $DEFAULT_BRANCH from '$CURRENT' to '$NEXT_MINOR'."
          mvn versions:set \
            -DnewVersion="$NEXT_MINOR" \
            -DgenerateBackupPoms=false \
            -B
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "chore(release): bump ${DEFAULT_BRANCH} to ${NEXT_MINOR} after ${VERSION} release"

          if ! git push origin "$DEFAULT_BRANCH"; then
            echo "::warning::Could not push the version bump to '$DEFAULT_BRANCH' (it may be protected). ${VERSION} IS released; please set $DEFAULT_BRANCH to ${NEXT_MINOR} manually."
          fi
